name: Pruebas autom�ticas

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'services/**'
      - 'ui/**'
      - 'main.js'
      - 'bootstrap.js'
      - 'scripts/**'
      - 'config/**'
      - 'preload.js'
      - 'renderer.js'
      - 'index.html'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'services/**'
      - 'ui/**'
      - 'main.js'
      - 'bootstrap.js'
      - 'scripts/**'
      - 'config/**'
      - 'preload.js'
      - 'renderer.js'
      - 'index.html'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js - pruebas
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Obtener el c�digo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Informe de vulnerabilidades de dependencias
        continue-on-error: true
        run: npm audit --json
